- slug: grok-bot-approval-controls
  axis_scores:
    technical_depth: 6
    voice: 9
    validation: 7
  axis_reasoning:
    technical_depth: 'The control design is real but the surface is a vendor console configured carefully
      rather than a system built. Spending is set to None, Auto Review is enabled and the plugin list is
      confirmed empty before the helper exists, eleven Ask first rules cover protected actions with none
      configured to allow itself, and a connection register carries a bank row held at NEVER. The strongest
      idea is architectural: standing rules and the approval gate are kept apart, so instruction never
      doubles as enforcement, and the absent mail connection backs the no-send rule technically rather than
      by written instruction. Held at 6 because the lens peers build software, a 28-agent firm with a PII
      gate and row-level tenancy or a schema-first warehouse over a 55,000-row universe, and this is
      configuration with two small evidence files.'
    voice: 'The register declines the flattering claim at every point one was available. The usage line
      records only what the screen showed, with no heading, no estimated allowance and no limit inferred,
      and the doc says so explicitly. The unsent note is reported as unsent. The closing passage refuses the
      obvious summary, stating that the result worth keeping was not that the helper drafted a note or wrote
      files but that a protected delete stopped, the denial preserved the file, no company application was
      connected and the message never left the lab. The limits are named rather than left implied: the work
      runs under a learning login, and a later connection is to need a separate purpose, an explicit
      approval and a revised register.'
    validation: 'The gate was tested with a real protected operation rather than a written example, and the
      test deliberately targeted the evidence file it was meant to protect. The approval card named the
      matching rule, Deny was selected, and the proof offered is the retained file still carrying its
      purpose line, its NEVER bank row and its None row dated 2026-09-15, rather than the helper reporting
      that it had stopped. The closing check re-read the whole control set at once instead of assuming
      earlier settings had held. Held at 7 because only one gate was exercised and only on the Deny path, so
      nothing here reports what an Allow would have produced, and several of the remaining checks confirm
      that a setting is still set rather than that a control acted.'
  average: 7.33
  rationale: A real delete stopped at the approval card, and the unchanged file is the proof rather than the bot
  featured: false
